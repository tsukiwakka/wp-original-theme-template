name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-lint:
    name: ビルド & Lint チェック
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Vite ビルド
        run: npm run build

      - name: PHP 構文チェック
        run: find theme -name "*.php" | xargs -I{} php -l {}
